<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<script>
//     =   ,    /go/   →   ?shop=   
(function(){var m=location.pathname.match(/^\/go\/([A-Za-z0-9_-]{6,40})\/?$/);if(m)history.replaceState(null,'','/?shop='+m[1]);})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> — </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&family=Noto+Serif+KR:wght@400;600&display=swap">
<meta name="theme-color" content="#295BF2">
<style> :root{
    --white:#FFFFFF;
    --deep-green:#1A3FB8;
    --navy:#295BF2;
    --sage:#6B85D6;
    --paper:#F6F7F5;
    --line:#E3E6E2;
    --ink:#20241F;
    --muted:#6B756B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:"Noto Sans KR","Malgun Gothic"," ",-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    word-break:keep-all;
    overflow-wrap:break-word;
  }

  header{
    background:var(--navy);
    color:var(--white);
    padding:18px 20px 16px;
    position:relative;
  }
  header .brand{
    font-size:12px;
    letter-spacing:0.02em;
    color:#B9C2D6;
    margin-bottom:4px;
    display:flex;
    align-items:center;
    gap:5px;
  }
  header .brand .brand-logo{
    width:14px;
    height:14px;
    flex-shrink:0;
  }
  header .brand .brand-name{
    color:#C0D904;
    font-weight:700;
  }
  header .title-row{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  header h1{
    font-size:20px;
    margin:0;
    font-weight:600;
  }
  header .role-badge{
    font-size:12px;
    font-weight:700;
    padding:4px 10px;
    border-radius:999px;
    background:#EAF2AE;
    color:#1A3FB8;
    flex-shrink:0;
  }
  body.role-teacher header .role-badge{
    background:#C0D904;
    color:#1A3FB8;
  }
  /* :     — :     */
  body.role-student header{
    background:#E6EDFE;
    color:var(--navy);
  }
  body.role-student header .brand{
    color:#5b6b85;
  }
  body.role-student header .brand-name{
    color:var(--navy);
  }
  body.role-student header .brand-logo{
    filter:brightness(0) saturate(100%);
    opacity:0.75;
  }
  body.role-student .gear-btn{
    background:rgba(39,77,234,0.08);
    color:var(--navy);
  }
  .gear-btn{
    background:rgba(255,255,255,0.12);
    border:none;
    color:var(--white);
    width:32px;height:32px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
    flex-shrink:0;
  }
  .progress-track{
    margin-top:14px;
    display:flex;
    gap:6px;
  }
  .progress-seg{
    flex:1;
    height:4px;
    border-radius:2px;
    background:rgba(255,255,255,0.25);
    overflow:hidden;
  }
  .progress-seg.done{background:var(--sage);}
  .progress-seg.active{background:var(--white);}
  body.role-student .progress-seg{background:rgba(39,77,234,0.18);}
  body.role-student .progress-seg.done{background:var(--sage);}
  body.role-student .progress-seg.active{background:var(--navy);}

  #screen-select{
    padding:22px 20px 100px;
    flex:1;
  }
  #screen-select p.lead{
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
    margin:0 0 20px;
  }
  .cat-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .cat-card{
    background:var(--white);
    border:1px solid var(--line);
    border-left:4px solid var(--deep-green);
    border-radius:6px;
    padding:14px 16px;
    text-align:left;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:inherit;
    width:100%;
  }
  .cat-card:active{background:#F0F2EF;}
  .cat-card .num{
    display:inline-block;
    width:22px;
    height:22px;
    line-height:22px;
    text-align:center;
    border-radius:50%;
    background:var(--deep-green);
    color:var(--white);
    font-size:12px;
    font-weight:700;
    margin-right:12px;
    flex-shrink:0;
  }
  .cat-card .cat-text{display:flex;align-items:center;flex:1;}
  .cat-card .cat-title{font-size:15px;font-weight:600;}
  .cat-card .cat-desc{font-size:12px;color:var(--muted);margin-top:2px;}
  .cat-card .cat-count{font-size:11px;color:var(--sage);margin-top:3px;}
  .cat-card .arrow{color:var(--muted);font-size:16px;}
  .free-card{background:var(--white);border:2px dashed var(--moa-app,var(--navy));border-radius:14px;padding:14px 16px;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
  .free-card .free-title{font-size:15px;font-weight:600;color:var(--ink)}
  .free-card .free-chips{display:flex;gap:6px;flex-wrap:wrap}
  .free-card .free-chip{font:inherit;font-size:13px;padding:6px 14px;border-radius:999px;border:1px solid #C9CED8;background:#fff;color:var(--ink);cursor:pointer}
  .free-card .free-chip.on{background:#141A2E;border-color:#141A2E;color:#fff}
  .free-card .free-inp{width:100%;font-size:16px}
  .free-card .free-notice{margin:0;font-size:12.5px;line-height:1.5;color:#8A5A00;background:#FFF6E0;border-radius:8px;padding:7px 10px}
  .free-card .free-err{margin:0;font-size:13px;color:#E5484D;min-height:0}
  .free-card .free-err:empty{display:none}
  .free-card .free-go{font:inherit;font-size:15px;font-weight:600;border:0;border-radius:10px;padding:12px;min-height:50px;background:var(--moa-ink,var(--navy));color:#fff;cursor:pointer}
  .free-card .free-go:disabled{opacity:.7;cursor:wait}
  /*      (2026-10-05) */
  .cb-card{border:1px solid #DCE3F5;border-radius:12px;padding:12px 14px;margin-top:10px;background:#F7F9FE;display:flex;flex-direction:column;gap:8px}
  .cb-card .cb-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .cb-card .cb-name{font-size:15px;font-weight:700;color:var(--ink)}
  .cb-card .cb-badge{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:#295BF2;color:#fff;white-space:nowrap}
  .cb-card .cb-ind{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
  .cb-card .cb-lbl{font-size:12.5px;font-weight:700;color:var(--ink)}
  .cb-card .cb-kw{display:flex;flex-wrap:wrap;gap:6px}
  .cb-card .cb-kw span{font-size:13px;padding:4px 11px;border-radius:999px;background:#fff;border:1px solid #DCE3F5;color:#1E3A8A}
  .cb-card details summary{cursor:pointer;font-size:13px;font-weight:700;color:#295BF2}
  .cb-card ol{margin:6px 0 0;padding-left:18px;font-size:13px;line-height:1.65;color:var(--ink)}
  .cb-card .cb-tip{margin:0;font-size:13px;line-height:1.55;color:#8A5A00;background:#FFF6E0;border-radius:8px;padding:7px 10px}
  .cb-card .cb-thin{margin:0;font-size:12.5px;color:#8A5A00}
  .cb-card .cb-src{font-size:12px;color:var(--muted);line-height:1.6}
  .cb-card .cb-src a{color:#295BF2;word-break:break-all}
  .cb-btn{font:inherit;font-size:14px;font-weight:600;border:1px solid #295BF2;color:#295BF2;background:#fff;border-radius:10px;padding:10px 12px;min-height:44px;margin-top:10px;width:100%;cursor:pointer}
  .cb-btn:disabled{opacity:.6;cursor:wait}
  .cb-err{margin:6px 0 0;font-size:13px;color:#E5484D}
  .cb-err:empty{display:none}
  .free-opt{display:flex;flex-direction:column;line-height:1.35}
  .free-opt small{font-size:12.5px;color:var(--muted);font-weight:400;margin-top:2px}
  .kw-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
  .kw-row:first-child{border-top:0}
  .kw-rank{width:24px;height:24px;border-radius:50%;background:#F1F3F7;color:var(--ink);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none}
  .kw-main{flex:1;min-width:140px;display:flex;flex-direction:column;font-size:14px}
  .kw-meta{font-size:12px;color:var(--muted)}
  .kw-btns{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .setup-card{
    background:var(--white);
    border:1px solid var(--line);
    border-left:4px solid var(--deep-green);
    border-radius:6px;
    padding:20px 18px;
    display:block;
  }
  .setup-card h3{
    font-size:16px;
    font-weight:700;
    margin:0 0 10px;
  }
  .setup-card p{
    font-size:13px;
    color:var(--muted);
    line-height:1.6;
    margin:0 0 14px;
  }
  .setup-card input{
    display:block;
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:8px;
    font-family:inherit;
    font-size:14px;
    margin-bottom:10px;
    box-sizing:border-box;
  }
  .setup-card button{ width:100%; }

  #screen-chat{display:none;flex:1;flex-direction:column;}
  .chat-body{
    flex:1;
    padding:18px 16px 16px;
    display:flex;
    flex-direction:column;
    gap:14px;
    overflow-y:auto;
  }
  .bubble{
    max-width:88%;
    padding:12px 14px;
    border-radius:10px;
    font-size:14px;
    line-height:1.6;
    white-space:pre-wrap;
  }
  .bubble.q{
    background:var(--navy);
    color:var(--white);
    align-self:flex-start;
    border-bottom-left-radius:2px;
  }
  .bubble.a{
    background:var(--white);
    border:1px solid var(--line);
    align-self:flex-end;
    border-bottom-right-radius:2px;
  }
  .bubble.f{
    background:#EFF6FF;
    border:1px solid #DBEAFE;
    align-self:flex-start;
    border-radius:14px;
    border-bottom-left-radius:4px;
    color:#0F172A;
  }
  /*   AI   (2026-09-30 ·   ' '  ·) */
  .fb-h{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:900;color:#1A43C9;margin-bottom:10px;}
  .fb-row{display:flex;gap:10px;margin-bottom:12px;}
  .fb-num{flex-shrink:0;width:24px;height:24px;border-radius:50%;background:#fff;border:1.5px solid;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;}
  .fb-row h5{margin:0 0 2px;font-size:14.5px;font-weight:700;}
  .fb-row p{margin:0;}
  .fb-row.good .fb-num{border-color:#10B981;color:#047857;} .fb-row.good h5{color:#047857;}
  .fb-row.fix .fb-num{border-color:#295BF2;color:#1A43C9;} .fb-row.fix h5{color:#1A43C9;}
  .fb-dir{background:#fff;border:1px solid #E2E8F0;border-radius:12px;padding:12px 14px;margin:4px 0 10px;}
  .fb-dir h5{margin:0 0 8px;font-size:14px;font-weight:700;color:#0F172A;}
  .fb-steps{display:flex;flex-wrap:wrap;gap:6px 22px;margin:0 0 6px;padding:0;list-style:none;}
  .fb-steps li{position:relative;padding:5px 10px;border-radius:8px;background:#F1F5F9;font-size:13px;font-weight:700;}
  .fb-steps li:not(:last-child)::after{content:'→';position:absolute;right:-16px;top:50%;transform:translateY(-50%);color:#94A3B8;font-weight:400;}
  .fb-dir .hint{margin:0;font-size:12.5px;color:#64748B;}
  .bubble.f details{margin:6px 0 0;}
  .bubble.f summary{cursor:pointer;min-height:40px;display:flex;align-items:center;font-size:13.5px;font-weight:700;color:#334155;}
  .bubble.f summary{list-style:none;gap:8px;} .bubble.f summary::-webkit-details-marker{display:none;}
  .bubble.f summary::after{content:'';margin-left:auto;font-size:12px;font-weight:500;color:#64748B;}
  .bubble.f details[open] > summary::after{content:'';}
  .bubble.f summary:focus-visible{outline:3px solid #93B4FB;outline-offset:2px;border-radius:6px;}
  .bubble.f details > div{padding:0 0 8px;}
  .fb-sample{font-family:'Noto Serif KR',serif;background:#F8FAFC;border:1px dashed #CBD5E1;border-radius:10px;padding:10px 12px;}
  .fb-sub{font-size:13px;font-weight:700;color:#334155;margin:8px 0 6px;}
  .bubble.f .f-title{
    font-weight:700;
    color:var(--deep-green);
    font-size:13px;
    margin-bottom:6px;
  }
  .bubble.loading{
    background:var(--white);
    border:1px solid var(--line);
    align-self:flex-start;
    color:var(--muted);
    font-size:13px;
  }

  .char-count-row{
    padding:4px 14px 0;
    text-align:right;
    background:var(--white);
    font-size:11px;
    color:var(--muted);
  }
  .char-count-row.over{color:#B4531A;font-weight:700;}

  .input-bar{
    border-top:1px solid var(--line);
    background:var(--white);
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    display:flex;
    gap:8px;
    align-items:flex-end;
  }
  .input-bar textarea{
    flex:1;
    resize:none;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-family:inherit;
    font-size:14px;
    line-height:1.5;
    max-height:120px;
    min-height:44px;
  }
  .input-bar textarea:focus{outline:2px solid var(--sage);outline-offset:1px;}
  .btn{
    border:none;
    border-radius:8px;
    padding:0 16px;
    height:44px;
    font-family:inherit;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
  }
  .btn-primary{background:var(--deep-green);color:var(--white);}
  .btn-primary:disabled{background:#A9BBAF;cursor:default;}

  .footer-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:8px 16px 4px;
    background:var(--white);
    border-top:1px solid var(--line);
  }
  .footer-row .back{font-size:13px;color:var(--muted);background:none;border:none;font-family:inherit;cursor:pointer;}

  .qnav{display:flex;align-items:center;gap:8px;}
  .qnav-btn{
    width:30px;height:30px;border-radius:50%;border:1px solid var(--line);
    background:var(--white);color:var(--navy);font-size:16px;line-height:1;
    cursor:pointer;font-family:inherit;
  }
  .qnav-btn:disabled{opacity:0.3;cursor:default;}
  .qnav-label{font-size:12px;color:var(--muted);min-width:34px;text-align:center;}

  .swipe-hint{font-size:11px;color:var(--muted);text-align:center;padding:4px 0 0;}

  .redo-btn{
    align-self:flex-start;background:var(--white);border:1px solid var(--line);
    color:var(--navy);border-radius:8px;padding:8px 14px;font-size:13px;
    font-family:inherit;cursor:pointer;margin-top:4px;
  }

  .progress-seg{cursor:pointer;}

  .dot-flash{display:inline-flex;gap:3px;}
  .dot-flash span{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:flash 1.1s infinite ease-in-out;}
  .dot-flash span:nth-child(2){animation-delay:0.15s;}
  .dot-flash span:nth-child(3){animation-delay:0.3s;}
  @keyframes flash{0%,80%,100%{opacity:0.25;}40%{opacity:1;}}

  /* Settings screen */
  #screen-settings{display:none;flex:1;flex-direction:column;overflow-y:auto;padding:20px 20px 40px;}
  #screen-settings h2{font-size:15px;margin:0 0 4px;color:var(--navy);}
  #screen-settings .hint{font-size:12px;color:var(--muted);margin:0 0 14px;line-height:1.6;}
  .settings-block{margin-bottom:22px;}
  .settings-block label{
    display:block;
    font-size:13px;
    font-weight:700;
    color:var(--deep-green);
    margin-bottom:6px;
  }
  .settings-block .sub{font-size:11px;color:var(--muted);margin-bottom:6px;}
  .settings-block textarea{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-family:inherit;
    font-size:13px;
    line-height:1.6;
    resize:vertical;
  }
  .settings-block input[type="text"]{
    width:100%;
    border:1px solid var(--line);
    border-radius:8px;
    padding:10px 12px;
    font-family:inherit;
    font-size:13px;
    box-sizing:border-box;
  }
  .settings-actions{
    display:flex;
    gap:8px;
    position:sticky;
    bottom:0;
    background:var(--paper);
    padding-top:12px;
  }
  .btn-secondary{background:var(--white);border:1px solid var(--line);color:var(--ink);}
  .save-status{font-size:12px;color:var(--sage);margin-left:8px;align-self:center;}

  .preset-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;}
  .preset-chip{
    display:flex;align-items:center;gap:6px;
    background:var(--white);border:1px solid var(--line);border-radius:20px;
    padding:6px 10px 6px 14px;font-size:12px;font-family:inherit;cursor:pointer;
  }
  .preset-chip:active{background:#F0F2EF;}
  .preset-chip .preset-del{
    color:var(--muted);font-size:14px;line-height:1;border:none;background:none;
    cursor:pointer;padding:0 2px;
  }
  .btn-add-preset{
    background:var(--paper);border:1px dashed var(--sage);color:var(--deep-green);
    border-radius:8px;padding:8px 12px;font-size:12px;font-family:inherit;cursor:pointer;
  }

  /* QR code block */
  .qr-box{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:10px;
    padding:18px;
    text-align:center;
  }
  .qr-box #qrcode-canvas{
    display:inline-block;
    margin-bottom:10px;
  }
  .qr-box #qrcode-canvas canvas,
  .qr-box #qrcode-canvas img{
    display:block;
    margin:0 auto;
    border-radius:6px;
  }
  .qr-box .qr-url{
    font-size:11px;
    color:var(--muted);
    word-break:break-all;
    margin-bottom:12px;
  }
  .qr-actions{display:flex;gap:8px;justify-content:center;}

  /* Admin submission list */
  #screen-admin-list{display:none;flex:1;flex-direction:column;padding:20px 20px 40px;overflow-y:auto;}
  .admin-list-header{display:flex;flex-direction:column;gap:4px;margin-bottom:14px;}
  .admin-list-header .back{align-self:flex-start;font-size:13px;color:var(--muted);background:none;border:none;font-family:inherit;cursor:pointer;padding:0;margin-bottom:6px;}
  .admin-list-header h2{margin:0;font-size:16px;color:var(--navy);}
  .submission-item{
    background:var(--white);border:1px solid var(--line);border-left:4px solid var(--deep-green);
    border-radius:6px;padding:12px 14px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .submission-item .s-name{font-weight:700;font-size:14px;}
  .submission-item .s-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .submission-item .s-actions{display:flex;gap:6px;flex-shrink:0;}
  .submission-item .s-actions button{
    border:1px solid var(--line);background:var(--white);border-radius:6px;
    padding:6px 10px;font-size:12px;font-family:inherit;cursor:pointer;
  }

  .toggle-row{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;}
  .toggle-row input{width:16px;height:16px;}

  #screen-review-list{display:none;flex:1;flex-direction:column;padding:20px 20px 40px;overflow-y:auto;}
  .review-item{
    background:var(--white);border:1px solid var(--line);border-left:4px solid #B4531A;
    border-radius:6px;padding:12px 14px;margin-bottom:10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;
  }
  .review-item .s-name{font-weight:700;font-size:14px;}
  .review-item .s-meta{font-size:12px;color:var(--muted);margin-top:2px;}
  .review-item .s-arrow{color:var(--muted);font-size:16px;flex-shrink:0;}

  #screen-review-detail{display:none;flex:1;flex-direction:column;padding:20px 20px 100px;overflow-y:auto;}
  .review-q-block{
    background:var(--white);border:1px solid var(--line);border-radius:8px;
    padding:14px;margin-bottom:14px;
  }
  .review-q-block .rq-question{font-weight:700;font-size:13px;color:var(--navy);margin-bottom:8px;}
  .review-q-block .rq-answer{font-size:13px;background:var(--paper);border-radius:6px;padding:8px 10px;margin-bottom:10px;white-space:pre-wrap;}
  .review-q-block label{display:block;font-size:11px;font-weight:700;color:var(--deep-green);margin:8px 0 4px;}
  .review-q-block textarea{
    width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;

let COMPANY_BRIEF_AUTO_TRIED = '';
function attachCompanyBrief(box, input){
  const wrap = document.createElement('div');
  box.appendChild(wrap);
  const hint = box.querySelector('p');
  if(hint) hint.textContent = '  ·      .';
  function paint(){

    const btn = wrap.querySelector('.cb-btn'), err = wrap.querySelector('.cb-err');
    btn.onclick = () => run(btn, err);
  }
  async function run(btn, err){
    const name = input.value.replace(/\s+/g, ' ').trim();
    if(name.length < 2){ err.textContent = '    .'; input.focus(); return; }
    btn.disabled = true; btn.textContent = '   ... (30 )'; err.textContent = '';

      const d = await r.json().catch(() => ({}));
      if(!r.ok || !d.brief){ throw new Error(d.error || '   .     .'); }
      STUDENT_COMPANY_BRIEF = { ...d.brief, query: name };
      STUDENT_COMPANY = name; input.value = name;
      if(CLIENT) clientSaveDraft();
      paint();

      btn.disabled = false; btn.textContent = '   ';
      err.textContent = e.message || '     .';
    }
  }
  input.addEventListener('input', () => { if(STUDENT_COMPANY_BRIEF && !briefMatches(STUDENT_COMPANY_BRIEF, input.value)) { STUDENT_COMPANY_BRIEF = null; paint(); } });

  }
}

async function sendAllCategoriesBundle(){

    items: orderedItems,

  try{

      const response = await fetch(apiUrl('/api/reviews'), {
        method: 'POST',

function exLeftWarn(count) {
  return confirm(`🟨    ${count} .\n\n   ,      .\n       .\n\n  ?`);

async function exCopyText(text) {
  try { await navigator.clipboard.writeText(text); alert('.    .'); }

document.addEventListener('click', async (e) => {
  const t = e.target.closest && e.target.closest('[data-exkey]');
  if (!t || t.classList.contains('ex-wrap') || t.classList.contains('ex-own-input')) return;
  const st = EX_STATE[t.dataset.exkey];
  if (!st) return;
  if (t.classList.contains('ex-slot')) {
    Object.values(EX_STATE).forEach(o => { if (o !== st && o.open >= 0) { o.open = -1; exRefresh(o); } });
    st.open = st.open === +t.dataset.k ? -1 : +t.dataset.k; exRefresh(st); return;
  }
  const sl = st.slots[st.open];
  if (t.classList.contains('ex-opt') && sl) { sl.value = sl.options[+t.dataset.opt]; st.open = exNextOpen(st); exSave(st); exRefresh(st); return; }
  if (t.classList.contains('ex-own-apply') && sl) {
    const inp = t.parentElement.querySelector('.ex-own-input');
    const v = (inp && inp.value || '').trim();
    if (!v) { inp && inp.focus(); return; }
    sl.value = v; st.open = exNextOpen(st); exSave(st); exRefresh(st); return;
  }
  if (t.classList.contains('ex-reset') && sl) { sl.value = null; exSave(st); exRefresh(st); return; }
  if (t.classList.contains('ex-close')) { st.open = -1; exRefresh(st); return; }
  if (t.classList.contains('ex-copy')) {
    const left = exLeft(st);
    if (left && !exLeftWarn(left)) return;
    exCopyText(exCompose(st, false)); return;
  }
  if (t.classList.contains('ex-copy-final')) {
    const left = (st.finalText.match(EX_RE) || []).length;
    if (left && !exLeftWarn(left)) return;
    exCopyText(exPlain(st.finalText)); return;
  }
  if (t.classList.contains('ex-finish')) {
    const left = exLeft(st);
    if (left && !exLeftWarn(left)) return;
    st.busy = true; st.open = -1; exRefresh(st);
    try {
      const resp = await fetch(apiUrl('/api/coach'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: 'finish', text: exCompose(st, true), charLimit: st.charLimit }) });
      const r = await resp.json().catch(() => ({}));
      if (!resp.ok) throw new Error(r.error || (' : ' + resp.status));
      st.finalText = r.text || '';
      exSave(st);
    } catch (err) { alert(' : ' + err.message); }
    st.busy = false; exRefresh(st);
  }
});

function buildFeedbackReq(question, text){
  const effectiveField = STUDENT_TARGET_FIELD_OVERRIDE || TARGET_FIELD;
  const jobContext = effectiveField
    ? `\n\n[ ]   '${effectiveField}' ·  .  good/improve/sample_direction/rewritten/interviewer_inference    ( ,     )    .`
    : '';
  //         ,      
  const basePrompt = STUDENT_PROMPT_OVERRIDE || SYSTEM_PROMPT;
  const companyContext = STUDENT_COMPANY
    ? `\n\n[ ]     '${STUDENT_COMPANY}'.           ,        ···     .`
    : '';
  //            (2026-10-05) —      
  const brief = STUDENT_COMPANY_BRIEF && companyDeepOn() ? STUDENT_COMPANY_BRIEF : null;
  const briefContext = brief
    ? `\n\n[    —   , ${brief.searchedAt || ''} ]\n: ${brief.name}${brief.industry ? ' — ' + brief.industry : ''}`
      + ((brief.values || []).length ? `\n  : ${brief.values.join(', ')}` : '')
      + (brief.issues || []).map((v, i) => `\n  ${i + 1}: ${v}`).join('')
      + `\n[   ] ·  · ·    .        good  ,   improve " (   )  "        . rewritten       ,   ··    {{ }}  . ··         .`
    : '';
  //   ,     AI  (   )
  const rfNote = findRedflagNote(question);
  const redflagContext = rfNote
    ? `\n\n[  ]   '${rfNote}'()  .      improve red_flags  ,       sample_direction .`
    : '';
  // 2026-10-05:    ·   ·   (  )
  const catId = currentCategory && currentCategory.id;
  const catGuide = catId === 'closing' ? CLOSING_GUIDE : (catId === 'ai-skill' ? AI_SKILL_GUIDE : '');
  const timing = (typeof window.moaAnswerTiming === 'function') ? window.moaAnswerTiming() : null;
  const overlap = resumeOverlapRatio(text);
  return {
    question, answer: text, hiringType: HIRING_TYPE,
    systemPrompt: basePrompt + jobContext + ASPIRATION_GUIDE + companyContext + briefContext + redflagContext + catGuide,
    answerSec: timing && timing.sec >= 5 ? timing.sec : 0, //  5    
    targetSec: timing && timing.sec >= 5 ? timing.target : 0,
    resumeSentences: RESUME_FU && RESUME_FU.s ? RESUME_FU.s : [],
    resumeOverlap: overlap >= 0.6
  };
}

function extractLegacyCriteria(set){
  const linked = findLinkedPreset(set);
  if(!linked || !linked.prompt) return '';
  if(linked.prompt.indexOf(DEFAULT_SYSTEM_PROMPT) !== 0) return '';
  let rest = linked.prompt.slice(DEFAULT_SYSTEM_PROMPT.length).trim();
  if(rest.charAt(0) === '['){
    const nl = rest.indexOf('\n');
    rest = nl >= 0 ? rest.slice(nl + 1).trim() : '';
  }
  return rest;
}

//    ↔    (" //  ")
function redflagToText(items){
  return (items || []).map(x => x && x.q ? (x.note ? `${x.q} // ${x.note}` : x.q) : '').filter(Boolean).join('\n');
}
function textToRedflag(text){
  return String(text || '').split('\n').map(line => {
    const t = line.trim();
    if(!t) return null;
    const cut = t.indexOf('//');
    if(cut < 0) return { q: t, note: '' };
    const q = t.slice(0, cut).trim();
    return q ? { q, note: t.slice(cut + 2).trim() } : null;
  }).filter(Boolean);
}

async function renderKeywordTop(){
  const box = document.getElementById('kw-top-list');
  if(!box) return;
  box.innerHTML = '<p class="st-sub"> ...</p>';
  let items = [];
  try{
    const r = await fetch('/api/generate-questions?t=' + encodeURIComponent(TEACHER_ID), {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: 'topKeywords' })
    });
    const data = await r.json().catch(() => ({}));
    if(!r.ok){ box.innerHTML = `<p class="st-sub">${escapeHtml(data.error || '  .')}</p>`; return; }
    items = data.items || [];
  }catch(e){ box.innerHTML = '<p class="st-sub"> .</p>'; return; }
  if(!items.length){
    box.innerHTML = '<p class="st-sub"> .  " +  "   .</p>';
    return;
  }
  const norm = v => String(v || '').replace(/\s/g, '').toLowerCase();
  box.innerHTML = '';
  items.forEach((it, i) => {
    const label = (it.pack && it.pack.label) || it.keyword;
    const added = JOB_QUESTION_SETS.some(st => norm(st.name) === norm(label));
    const row = document.createElement('div');
    row.className = 'kw-row';
    row.innerHTML = ` <span class="kw-rank">${i + 1}</span> <span class="kw-main"><b>${escapeHtml(label)}</b><span class="kw-meta">${escapeHtml(it.kindName)} · ${it.count}${label !== it.keyword ? ' · : ' + escapeHtml(it.keyword) : ''}</span></span> <span class="kw-btns"> ${added ? '<span class="st-ok" style="font-size:13px"> </span>'
          : (it.pack ? '<button class="btn-small kw-add" type="button"> </button>' : '<span class="st-sub" style="font-size:12px"> </span>')} <button class="btn-small kw-del" type="button" aria-label=" "></button> </span>`;
    const addBtn = row.querySelector('.kw-add');
    if(addBtn) addBtn.onclick = async () => {
      if(!confirm(`'${label}'()   ?\n     .`)) return;
      const p = it.pack;
      JOB_QUESTION_SETS.push({
        name: label,
        questions: (p.questions || []).slice(),
        criteria: (p.criteria || '').trim(),
        targetField: p.kind === 'company' ? label + ' ' : label,
        visible: true
      });
      await autoSaveToday();
      renderTodayTab();
    };
    row.querySelector('.kw-del').onclick = async () => {
      if(!confirm(`'${label}'()   ? (    )`)) return;
      try{
        await fetch('/api/generate-questions?t=' + encodeURIComponent(TEACHER_ID), {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: 'dismissKeyword', member: it.member })
        });

      renderKeywordTop();
    };
    box.appendChild(row);
  });
}

const RR_LIST = [];
function rrHeroInner(item, i, total, record){
  RR_LIST[i] = { item, i, total, record };
  const fb = item.feedback || {};
  const flags = Array.isArray(fb.red_flags) ? fb.red_flags.filter(f => f && (f.quote || f.why)).length : 0;
  const has = exHasSlots(fb);
  const st = has ? exInit(exFbItem(fb, item.question)) : null;
  const n = st ? st.slots.length : 0;
  const left = st ? exLeft(st) : 0;
  const pct = n ? Math.round((n - left) / n * 100) : 0;
  let head;
  if (flags) head = `   ${flags}<br> `;
  else if (left) head = ` ${left} <br> `;
  else if (fb.improve) head = `  ,<br> `;
  else head = ` .<br> `;
  const cat = item.categoryTitle || (record && record.category) || '';
  return ` <div class="rr-hero-top"><span>Q${i + 1}${cat ? ' · ' + escapeHtml(cat) : ''}</span><span>${i + 1} / ${total}</span></div> <p class="rr-hero-q">${escapeHtml(item.question)}</p> <p class="rr-hero-head">${head}</p> ${n ? `<div class="rr-hero-bar" role="img" aria-label="  ${pct}%"><i style="width:${pct}%"></i></div><p class="rr-hero-sub"> ${n - left} / ${n} ·  ${pct}%</p>` : ''}`;
}
function rrRefreshHero(key){
  document.querySelectorAll(`.rr-hero[data-exkey="${key}"]`).forEach(h => {
    const r = RR_LIST[+h.dataset.rridx]; if (r) h.innerHTML = rrHeroInner(r.item, r.i, r.total, r.record);
  });
}

window.addEventListener('popstate', (e) => {

  const isStudentNow = !document.body.classList.contains('role-teacher');
  //    =

  if(!toList && isStudentNow && screenChat.style.display === 'flex' && currentCategory && state.screen !== 'chat' && currentQuestionIdx > 0){
    goPrev();
    history.pushState({ screen: 'chat', catId: currentCategory.id }, '');

  }

  if(state.screen === 'chat' && state.catId){
    const cat = CATEGORIES.find(c => c.id === state.catId) || CATEGORIES[0];
    if(cat) startCategory(cat, true);
  } else if(state.screen === 'settings'){
    openSettings(true);
  } else {
    showSelectScreen();

      renderJobSelectScreen();

});

    });
    const blues = ['#295BF2', '#1A3FB8', '#4C7BF5', '#11308C', '#6B85D6'];
    items = Array.from(map.values()).sort((a, b) => b.count - a.count).slice(0, 60)

//  "" :       ,      
// (     3   )
function liveHash(str){ let h = 0; for(const ch of String(str)) h = (h * 31 + ch.charCodeAt(0)) | 0; return Math.abs(h); }
function layoutLiveCloud(cloud, items){
  const W = Math.max(cloud.clientWidth - 20, 280);
  const H = Math.max(cloud.clientHeight - 20, 300);
  const key = W + 'x' + H + '|' + items.map(i => i.text + ':' + i.count + ':' + i.color).join('|') + '|' + LIVE.view;
  if(cloud.dataset.key === key) return;
  cloud.dataset.key = key;
  const prevWords = new Set(Array.from(cloud.querySelectorAll('.lv-word')).map(w => w.dataset.text));
  cloud.style.display = 'block';
  cloud.style.position = 'relative';
  cloud.style.overflow = 'hidden';
  cloud.innerHTML = '';

  const max = Math.max(...items.map(i => i.count)), min = Math.min(...items.map(i => i.count));
  const scale = Math.min(1.25, Math.max(0.7, W / 1000));
  const minF = Math.round(18 * scale), maxF = Math.round((items.length <= 3 ? 72 : 64) * scale);
  const cx = W / 2 + 10, cy = H / 2 + 10;
  const placed = [];
  const hit = (a) => placed.some(b => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y);

  items.forEach((it, idx) => {
    let size = max === min ? Math.round((minF + maxF) / 2) : Math.round(minF + (it.count - min) / (max - min) * (maxF - minF));
    const el = document.createElement('span');
    el.className = 'lv-word';
    el.dataset.text = it.text;
    el.title = it.count + '';
    el.innerHTML = escapeHtml(it.text) + (it.count > 1 ? `<sup style="font-size:12px;color:var(--muted);margin-left:2px;font-weight:600">${it.count}</sup>` : '');
    el.style.cssText = `position:absolute;left:0;top:0;white-space:nowrap;line-height:1.15;color:${it.color};font-weight:${size >= 40 ? 800 : 700};cursor:${LIVE.view === 'raw' ? 'pointer' : 'default'};visibility:hidden;transition:opacity .6s ease, transform .6s ease`;
    cloud.appendChild(el);

    let ok = false;
    for(let attempt = 0; attempt < 4 && !ok; attempt++){
      el.style.fontSize = size + 'px';
      const w = el.offsetWidth + 10, h = el.offsetHeight + 4;
      const turn = (liveHash(it.text) % 628) / 100;   //    
      for(let t = 0; t < 60; t += 0.09){
        const r = idx === 0 ? t * 2 : 6 + t * 5.5;
        const x = cx + r * 1.6 * Math.cos(t + turn) - w / 2;   //    
        const y = cy + r * 0.9 * Math.sin(t + turn) - h / 2;
        if(x < 6 || y < 6 || x + w > W + 14 || y + h > H + 14) continue;
        const box = { x, y, w, h };
        if(!hit(box)){ placed.push(box); el.style.left = (x + 5) + 'px'; el.style.top = (y + 2) + 'px'; ok = true; break; }
      }
      if(!ok) size = Math.max(12, Math.round(size * 0.8));   //     
    }
    if(!ok){ el.remove(); return; }
    const isNew = prevWords.size && !prevWords.has(it.text);
    el.style.visibility = 'visible';
    if(isNew){ el.style.opacity = '0'; el.style.transform = 'scale(.6)'; requestAnimationFrame(() => { el.style.opacity = '1'; el.style.transform = 'scale(1)'; }); }
  });
}

(async function init(){
  const params = new URLSearchParams(location.search);
  if(params.get('live')){
    await renderLiveStudent(String(params.get('live')).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8));
    return;
  }
  if(params.get('shop') && params.get('admin') !== '1'){
    await renderShopJoin(params.get('shop'));
    return;
  }
  if(params.get('c') && params.get('admin') !== '1'){
    await initClientMode(params.get('c'));
    return;
  }
  if(params.get('master') === '1'){
    document.body.classList.add('role-teacher');
    document.getElementById('role-badge').textContent = '';
    renderMasterTeacherList();
    return;
  }
  const isAdmin = params.get('admin') === '1';
  gearBtn.style.display = isAdmin ? 'inline-block' : 'none';
  document.body.classList.add(isAdmin ? 'role-teacher' : 'role-student');
  document.getElementById('role-badge').textContent = (isAdmin ? '' : '') + (TEACHER_ID ? ' · ' + TEACHER_ID : '');

  const hash = location.hash;
  if(hash && hash.indexOf('#result=') === 0){
    if(!TEACHER_ID){ renderMissingTeacherScreen(); return; }
    const id = hash.replace('#result=', '');
    await renderResultView(id);
    return;
  }

  if(!TEACHER_ID){
    if(isAdmin){ renderTeacherSetupScreen(); return; }
    renderMissingTeacherScreen();
    return;
  }

  if(await isTeacherBlocked(TEACHER_ID)){ renderBlockedScreen(isAdmin); return; }

  history.replaceState({ screen: 'select' }, '');
  await loadConfig();
  if(!isAdmin) applyResumeHandoff(); //      (2026-10-05)
  if(!isAdmin) STU_RESTORED_N = stuLoadAnswers(); //    
  if(!isAdmin) moaUse('start'); //   
  if(!isAdmin && jobScreenNeeded()){
    renderJobSelectScreen();
    setupStudentBackGuard('jobs');
  } else {
    renderCategories();
    if(!isAdmin) setupStudentBackGuard('cats');
  }
  //        
  window.addEventListener('beforeunload', ev => { if(!isAdmin && studentHasUnsaved()){ ev.preventDefault(); ev.returnValue = ''; } });
})();
